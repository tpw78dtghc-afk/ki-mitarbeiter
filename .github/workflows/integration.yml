name: Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ki_mitarbeiter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ki_mitarbeiter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ki_mitarbeiter_test?schema=public
      BETTER_AUTH_SECRET: github-actions-test-secret-change-me-32chars
      BETTER_AUTH_URL: http://localhost:3000
      ANTHROPIC_API_KEY: test-key
      ANTHROPIC_MODEL: claude-sonnet-5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm install
      - run: npm ls better-auth
      - run: npm run prisma:generate
      - run: npm run prisma:migrate -- --name init
      - run: npm run verify-tenant-hook
      - run: npm run create-owner
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
